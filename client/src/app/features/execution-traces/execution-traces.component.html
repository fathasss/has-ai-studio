<div class="h-full flex flex-col relative w-full h-[calc(100vh-6rem)]">
    <div class="mb-6 flex justify-between items-end flex-shrink-0">
      <div>
        <h2 class="text-2xl font-bold text-white mb-1">Global Execution Traces</h2>
        <p class="text-gray-400 text-sm">Historical agent output replay (Raw Responses)</p>
      </div>
      <button (click)="loadTraces()" class="px-4 py-2 border border-white/20 rounded-lg text-sm bg-black hover:bg-white/10 transition-colors">
        Reload Traces
      </button>
    </div>
  
    <div class="flex-1 bg-black/40 border border-white/10 rounded-xl overflow-y-auto p-6 scroll-smooth">
      <div *ngIf="traces.length === 0" class="text-center text-gray-500 py-10">No execution traces available...</div>
      
      <div class="flex flex-col gap-6">
          <div *ngFor="let t of traces" class="bg-black/60 border border-white/10 rounded-xl overflow-hidden hover:border-white/20 transition-all">
              <div class="flex justify-between items-center p-4 border-b border-white/10 bg-white/5">
                  <div class="flex items-center gap-3">
                      <span class="inline-block px-2 py-1 bg-blue-500/10 text-blue-400 text-xs font-bold uppercase rounded border border-blue-500/20">
                          {{t.agent}}
                      </span>
                      <span class="text-sm font-mono text-gray-400">Pipeline: {{t.sprint_id}}</span>
                  </div>
                  <span class="text-xs text-gray-500">{{t.timestamp | date:'medium'}}</span>
              </div>
              <div class="p-4 overflow-x-auto">
                 <pre class="text-[0.85rem] text-gray-300 font-mono whitespace-pre-wrap">{{t.response}}</pre>
                 <div class="mt-4 text-xs text-gray-500 font-mono text-right border-t border-white/5 pt-2">
                     Duration: {{t.duration_ms | number:'1.0-0'}} ms | Status: <span [ngClass]="t.status === 'SUCCESS' ? 'text-green-500' : 'text-red-500'">{{t.status}}</span>
                 </div>
              </div>
          </div>
      </div>
    </div>
  </div>
