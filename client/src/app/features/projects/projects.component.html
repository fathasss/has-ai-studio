<div class="p-6 space-y-6 animate-in fade-in duration-500">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-3">
        <span class="p-2 bg-yellow-500/10 rounded-lg border border-yellow-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        Completed Projects
      </h1>
      <p class="text-gray-400 mt-1 italic text-sm">Browse previously created project sources.</p>
    </div>
    <button (click)="loadProjects()" class="flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg transition-all text-sm group text-gray-300 hover:text-white">
      <svg class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.21-8.58"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Refresh
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 min-h-[600px]">
    <div class="lg:col-span-1 space-y-4">
      <!-- Project List -->
      <div class="bg-[#111111] border border-white/5 rounded-xl overflow-hidden shadow-2xl">
        <div class="px-4 py-2.5 bg-white/5 border-b border-white/5 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Projects</span>
            <span class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded text-gray-400">{{ filteredProjects.length }}</span>
          </div>
          <!-- Search Input -->
          <div class="relative">
            <svg class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" [(ngModel)]="searchQuery" placeholder="Search projects..." class="w-full bg-black/20 border border-white/5 rounded-lg py-1.5 pl-8 pr-3 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-yellow-500/50 transition-colors">
          </div>
        </div>
        <div class="p-1.5 max-h-[250px] overflow-y-auto custom-scrollbar">
          <div *ngFor="let p of filteredProjects" (click)="selectProject(p)"
               [class]="selectedProject === p ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-500' : 'text-gray-400 hover:bg-white/5'"
               class="flex items-center gap-3 px-3 py-2 rounded-lg border border-transparent cursor-pointer transition-all mb-1">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span class="text-xs font-medium truncate">{{ p }}</span>
          </div>
          <div *ngIf="filteredProjects.length === 0" class="p-3 text-center text-gray-600 text-[10px] italic">
            No projects found.
          </div>
        </div>
      </div>

      <!-- File Tree -->
      <div *ngIf="selectedProject" class="bg-[#111111] border border-white/5 rounded-xl overflow-hidden shadow-2xl animate-in slide-in-from-left duration-300">
        <div class="px-4 py-2.5 bg-white/5 border-b border-white/5 flex items-center justify-between">
          <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Files</span>
        </div>
        <div class="p-1.5 max-h-[350px] overflow-y-auto custom-scrollbar">
          <ng-template #nodeTemplate let-nodes="nodes">
            <div *ngFor="let node of nodes" class="pl-1.5">
              <div (click)="toggleNode(node, $event)"
                   [class]="node.isDirectory ? 'text-gray-400 hover:bg-white/5' : (selectedFile === node.path ? 'bg-blue-500/10 border-blue-500/30 text-blue-400' : 'text-gray-500 hover:bg-white/5')"
                   class="flex items-center gap-2 px-2 py-1.5 rounded-lg border border-transparent cursor-pointer transition-all mb-0.5">
                
                <!-- Expanded Folder Icon -->
                <svg *ngIf="node.isDirectory && node.expanded" class="w-3.5 h-3.5 fill-yellow-500/20 text-yellow-500 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>

                <!-- Collapsed Folder Icon -->
                <svg *ngIf="node.isDirectory && !node.expanded" class="w-3.5 h-3.5 fill-gray-500/20 text-gray-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                
                <!-- File Icon -->
                <svg *ngIf="!node.isDirectory" class="w-3 h-3 opacity-60 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                
                <span class="text-[11px] truncate select-none">{{ node.name }}</span>
              </div>
              
              <!-- Recursive Children -->
              <div *ngIf="node.isDirectory && node.expanded" class="border-l border-white/5 ml-3 pl-1.5 mt-0.5">
                <ng-container *ngTemplateOutlet="nodeTemplate; context:{nodes: node.children}"></ng-container>
              </div>
            </div>
          </ng-template>

          <ng-container *ngTemplateOutlet="nodeTemplate; context:{nodes: fileTree}"></ng-container>
          
          <div *ngIf="files.length === 0" class="p-4 text-center text-gray-500 text-xs italic">
            No files available.
          </div>
        </div>
      </div>
    </div>

    <!-- Content Viewer -->
    <div class="lg:col-span-3">
      <div class="bg-[#111111] border border-white/5 rounded-xl h-full flex flex-col overflow-hidden shadow-2xl">
        <div class="px-5 py-3 bg-white/5 border-b border-white/5 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-3">
            <div *ngIf="selectedFile" class="w-7 h-7 rounded bg-blue-500/10 flex items-center justify-center border border-blue-500/20 text-blue-400">
              <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="truncate">
              <span class="text-xs font-bold text-white block truncate">{{ selectedFile || 'Explorer' }}</span>
              <span class="text-[9px] text-gray-500 uppercase font-mono" *ngIf="selectedFile">{{ selectedProject }}</span>
            </div>
          </div>
          <span *ngIf="selectedFile" class="text-[9px] px-1.5 py-0.5 rounded bg-white/5 text-gray-500 border border-white/5 uppercase font-bold tracking-widest">Read Only</span>
        </div>

        <div class="flex-1 p-0 overflow-hidden relative bg-[#0a0a0a]">
          <div *ngIf="loading" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-10 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 border-2 border-yellow-500/30 border-t-yellow-500 rounded-full animate-spin"></div>
            <span class="text-[10px] text-yellow-500 font-bold uppercase tracking-widest">Processing</span>
          </div>

          <div class="h-full overflow-auto custom-scrollbar p-5">
            <pre *ngIf="highlightedContent" class="text-[12px] leading-relaxed font-mono whitespace-pre selection:bg-yellow-500/30"><code class="hljs" [innerHTML]="highlightedContent"></code></pre>
            
            <div *ngIf="!selectedFile && !loading" class="h-full flex flex-col items-center justify-center text-center opacity-20 italic space-y-4">
              <svg class="w-14 h-14" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
              <div class="text-sm">Select a project and file to display source code</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
