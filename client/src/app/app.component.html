<div class="flex h-screen w-full bg-[#06080d] bg-[radial-gradient(ellipse_at_top,_#0d1424_0%,_#06080d_85%)] text-[#f8fafc] font-['Outfit'] overflow-hidden">
  
  <!-- Left Sidebar Navigation (Cyber Glass Theme) -->
  <app-sidebar class="w-20 md:w-64 flex-shrink-0 border-r border-white/[0.08] bg-[#0a0e17]/90 backdrop-blur-xl z-20"></app-sidebar>

  <!-- Main Application Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden bg-transparent">
    <!-- Header/Top Bar (Cyber Glass Theme) -->
    <app-header class="h-16 border-b border-white/[0.08] bg-[#0a0e17]/80 backdrop-blur-xl flex-shrink-0 z-10" 
                [rightPanelOpen]="rightPanelOpen" 
                (toggleRightPanel)="toggleRightPanel()"></app-header>
    
    <!-- Dynamic Content Outlet (Full Viewport Edge-to-Edge) -->
    <div class="flex-1 overflow-hidden relative">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Right Panel for Agent Status (Collapsible Cyber Glass Theme) -->
  <app-right-panel *ngIf="rightPanelOpen" 
                   class="w-64 flex-shrink-0 border-l border-white/[0.08] bg-[#0a0e17]/90 backdrop-blur-xl hidden lg:block transition-all duration-300 z-20"></app-right-panel>
  
</div>
