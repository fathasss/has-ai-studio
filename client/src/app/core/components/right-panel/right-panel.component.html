<div class="h-full flex flex-col p-5">
    <div class="flex items-center justify-between mb-5">
      <div class="text-[10px] text-cyan-400 uppercase tracking-widest font-black flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
        {{ 'agentPanel.title' | translate }}
      </div>
      <span class="text-[9px] font-mono text-gray-500 bg-[#06080d] px-2 py-0.5 rounded border border-white/5">{{agents.length}} {{ 'agentPanel.activeCount' | translate }}</span>
    </div>
    
    <div class="flex-1 space-y-2.5 overflow-y-auto pr-1 custom-scrollbar">
      <div *ngFor="let agent of agents" 
           class="flex flex-col gap-1.5 p-3 rounded-xl border border-white/[0.08] bg-[#0c1220]/75 hover:bg-[#121a2c]/90 hover:border-cyan-500/30 transition-all duration-200 group cursor-default">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <!-- Neon Status Dot -->
            <div class="w-2.5 h-2.5 rounded-full transition-all duration-500 shrink-0" [ngClass]="{
              'bg-emerald-400 shadow-[0_0_10px_#10b981,0_0_20px_#10b981]': agent.status === 'WORKING',
              'bg-yellow-400 shadow-[0_0_10px_#facc15,0_0_20px_#facc15]': agent.status === 'AVAIL',
              'bg-red-500 shadow-[0_0_10px_#ef4444,0_0_20px_#ef4444]': agent.status === 'DOWN'
            }"></div>
            <div class="flex flex-col">
              <span class="font-bold text-xs tracking-wide text-gray-100 group-hover:text-cyan-300 transition-colors">{{agent.name}}</span>
              <span class="text-[9px] text-gray-500 uppercase tracking-wider font-mono">{{agent.role || 'Agent'}}</span>
            </div>
          </div>
          <span class="text-[0.65rem] tracking-[0.1em] font-black uppercase px-2 py-0.5 rounded border transition-all duration-300" 
                [ngClass]="{
                  'text-emerald-400 bg-emerald-500/10 border-emerald-500/30': agent.status === 'WORKING',
                  'text-yellow-400 bg-yellow-500/10 border-yellow-500/30': agent.status === 'AVAIL',
                  'text-red-400 bg-red-500/10 border-red-500/30': agent.status === 'DOWN'
                }">
            {{ (agent.status === 'WORKING' ? 'agentPanel.statusWorking' : (agent.status === 'AVAIL' ? 'agentPanel.statusAvail' : 'agentPanel.statusDown')) | translate }}
          </span>
        </div>
      </div>
    </div>
</div>
