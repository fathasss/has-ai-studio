<div class="h-full px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h2 class="text-xl font-bold tracking-wide text-white drop-shadow-sm flex items-center gap-2" id="active-panel-title">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#06b6d4]"></span>
        {{pageTitle}}
      </h2>
      <div class="h-4 w-px bg-white/10 hidden md:block"></div>
      <span class="text-xs text-gray-400 font-mono hidden md:block" id="system-time">{{currentTime}}</span>
    </div>
    
    <div class="flex items-center gap-3 text-sm h-full">
      <!-- Uptime Metric (Cyber Cyan Glass) -->
      <div class="flex items-center gap-3 bg-[#0c1220]/80 border border-cyan-500/20 px-4 py-2 rounded-xl backdrop-blur-md hover:border-cyan-500/40 hover:shadow-[0_0_15px_rgba(6,182,212,0.15)] transition-all group">
        <div class="w-8 h-8 rounded-lg bg-cyan-500/15 flex items-center justify-center border border-cyan-500/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[0.65rem] uppercase tracking-[0.1em] text-gray-400 font-bold leading-tight">Uptime</span>
          <span class="font-mono text-[0.9rem] text-cyan-300 font-black leading-tight tracking-wider">{{uptime}}</span>
        </div>
      </div>

      <!-- Token Rate Metric (Cyber Gold Glass) -->
      <div class="flex items-center gap-3 bg-[#141208]/80 border border-yellow-400/20 px-4 py-2 rounded-xl backdrop-blur-md hover:border-yellow-400/40 hover:shadow-[0_0_15px_rgba(250,204,21,0.15)] transition-all group hidden sm:flex">
        <div class="w-8 h-8 rounded-lg bg-yellow-400/15 flex items-center justify-center border border-yellow-400/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[0.65rem] uppercase tracking-[0.1em] text-gray-400 font-bold leading-tight">Tokens/m</span>
          <span class="font-mono text-[0.9rem] text-yellow-400 font-black leading-tight tracking-wider">{{tokenRate}}</span>
        </div>
      </div>

      <!-- Right Panel Collapsible Toggle Button -->
      <button (click)="toggleRightPanel.emit()" 
              class="flex items-center gap-2 px-3 py-2 rounded-xl border border-white/10 bg-[#0c1220]/60 hover:bg-cyan-500/10 hover:border-cyan-500/30 transition-all text-xs font-semibold text-gray-300 hover:text-white group"
              [title]="rightPanelOpen ? 'Ajan panelini daralt' : 'Ajan panelini genişlet'">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.rotate-180]="!rightPanelOpen" class="transition-transform duration-300 text-gray-400 group-hover:text-cyan-400">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <line x1="15" x2="15" y1="3" y2="21"/>
        </svg>
        <span class="hidden md:inline">{{ rightPanelOpen ? 'Paneli Daralt' : 'Ajanlar' }}</span>
      </button>

      <!-- User / Avatar placeholder -->
      <div class="w-10 h-10 rounded-xl bg-[#0c1220]/60 border border-white/10 flex items-center justify-center cursor-pointer hover:bg-cyan-500/10 hover:border-cyan-500/30 transition-all group">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 group-hover:text-cyan-400 transition-colors"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </div>
