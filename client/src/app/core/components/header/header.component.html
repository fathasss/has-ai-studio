<div class="h-full px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h2 class="text-xl font-semibold tracking-wide" id="active-panel-title">{{pageTitle}}</h2>
      <div class="h-4 w-px bg-white/10 hidden md:block"></div>
      <span class="text-xs text-gray-500 hidden md:block" id="system-time">{{currentTime}}</span>
    </div>
    
    <div class="flex items-center gap-4 text-sm h-full">
      <!-- Uptime Metric -->
      <div class="flex items-center gap-3 bg-white/5 border border-white/10 px-4 py-2 rounded-xl backdrop-blur-md hover:bg-white/10 transition-all group">
        <div class="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center border border-blue-500/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[0.65rem] uppercase tracking-[0.1em] text-gray-500 font-bold leading-tight">Uptime</span>
          <span class="font-mono text-[0.9rem] text-white font-black leading-tight tracking-wider">{{uptime}}</span>
        </div>
      </div>

      <!-- Token Rate Metric -->
      <div class="flex items-center gap-3 bg-white/5 border border-white/10 px-4 py-2 rounded-xl backdrop-blur-md hover:bg-white/10 transition-all group hidden sm:flex">
        <div class="w-8 h-8 rounded-lg bg-yellow-400/20 flex items-center justify-center border border-yellow-400/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[0.65rem] uppercase tracking-[0.1em] text-gray-500 font-bold leading-tight">Tokens/m</span>
          <span class="font-mono text-[0.9rem] text-yellow-400 font-black leading-tight tracking-wider">{{tokenRate}}</span>
        </div>
      </div>

      <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center cursor-pointer hover:bg-white/15 hover:border-white/30 transition-all group ml-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 group-hover:text-white transition-colors"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </div>
