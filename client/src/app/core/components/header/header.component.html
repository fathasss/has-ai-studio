<div class="h-full px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h2 class="text-xl font-semibold tracking-wide" id="active-panel-title">{{pageTitle}}</h2>
      <div class="h-4 w-px bg-white/10 hidden md:block"></div>
      <span class="text-xs text-gray-500 hidden md:block" id="system-time">{{currentTime}}</span>
    </div>
    
    <div class="flex items-center gap-6 text-sm">
      <div class="flex flex-col items-end">
        <span class="text-gray-400 text-xs">Uptime</span>
        <span class="font-mono text-white">{{uptime}}</span>
      </div>
      <div class="flex flex-col items-end hidden sm:flex">
        <span class="text-gray-400 text-xs">Tokens / min</span>
        <span class="font-mono text-yellow-400">{{tokenRate}}</span>
      </div>
      <div class="w-8 h-8 rounded-full bg-white/10 border border-white/20 flex items-center justify-center cursor-pointer hover:bg-white/20 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </div>
