<div class="h-full flex flex-col justify-between py-6">
  <!-- Brand / Logo Area -->
  <div class="px-6 flex items-center justify-center md:justify-start gap-4 mb-10">
    <div class="w-14 h-14 shrink-0 flex items-center justify-center bg-white/5 rounded-xl border border-white/10 p-2 shadow-lg backdrop-blur-md relative overflow-hidden group">
      <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      <img src="assets/has_ai_studio_logo.png?v=fixed-bg" alt="HAS AI STUDIO" class="w-full h-full object-contain drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] relative z-10 transition-transform duration-300 group-hover:scale-105">
    </div>
    <div class="hidden md:flex flex-col">
      <span class="font-bold text-[1.1rem] tracking-[0.15em] text-yellow-400 [text-shadow:0_0_10px_rgba(250,204,21,0.8),0_0_20px_rgba(250,204,21,0.4)] leading-tight">HAS AI</span>
      <span class="font-bold text-[1.1rem] tracking-[0.15em] text-yellow-400 [text-shadow:0_0_10px_rgba(250,204,21,0.8),0_0_20px_rgba(250,204,21,0.4)] leading-tight">STUDIO.</span>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 mt-6 space-y-1">
    <a routerLink="/dashboard" routerLinkActive="bg-white/10 text-white font-medium" 
       class="flex items-center gap-4 px-4 py-3.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm mb-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span class="hidden md:block">Dashboard</span>
    </a>
    <a routerLink="/active-projects" routerLinkActive="bg-white/10 text-white font-medium" 
       class="flex items-center gap-4 px-4 py-3.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm mb-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span class="hidden md:block">Active Projects</span>
    </a>
    <a routerLink="/execution-traces" routerLinkActive="bg-white/10 text-white font-medium" 
       class="flex items-center gap-4 px-4 py-3.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm mb-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span class="hidden md:block">Logs & Traces</span>
    </a>
    
    <div class="pt-6 pb-2 px-4 text-xs font-bold text-gray-600 uppercase tracking-widest hidden md:block">System</div>
    
    <a routerLink="/settings" routerLinkActive="bg-white/10 text-white font-medium" 
       class="flex items-center gap-4 px-4 py-3.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="hidden md:block">Settings</span>
    </a>
  </nav>

  <!-- System Status -->
  <div class="px-6 mt-auto hidden md:block">
    <div class="text-xs text-gray-400 mb-2 uppercase tracking-wider">System Status</div>
    <div class="bg-black/30 rounded-lg p-3 border border-white/5 space-y-3">
      
      <!-- CPU -->
      <div>
        <div class="flex justify-between items-center mb-1 text-[0.65rem] uppercase tracking-widest font-bold">
          <span class="text-gray-400">CPU</span>
          <span class="text-gray-300">{{ cpuUsage }}%</span>
        </div>
        <div class="h-1 bg-gray-800 rounded-full overflow-hidden">
          <div class="h-full bg-blue-400 transition-all duration-300 ease-out" [style.width.%]="cpuUsage"></div>
        </div>
      </div>

      <!-- RAM -->
      <div>
        <div class="flex justify-between items-center mb-1 text-[0.65rem] uppercase tracking-widest font-bold">
          <span class="text-gray-400">RAM</span>
          <span class="text-gray-300">{{ ramUsage }}%</span>
        </div>
        <div class="h-1 bg-gray-800 rounded-full overflow-hidden">
          <div class="h-full bg-yellow-400 transition-all duration-300 ease-out" [style.width.%]="ramUsage"></div>
        </div>
      </div>

      <!-- DISK -->
      <div>
        <div class="flex justify-between items-center mb-1 text-[0.65rem] uppercase tracking-widest font-bold">
          <span class="text-gray-400">DISK</span>
          <span class="text-gray-300">{{ diskUsage }}%</span>
        </div>
        <div class="h-1 bg-gray-800 rounded-full overflow-hidden">
          <div class="h-full bg-green-400 transition-all duration-300 ease-out" [style.width.%]="diskUsage"></div>
        </div>
      </div>

      <!-- GPU -->
      <div>
        <div class="flex justify-between items-center mb-1 text-[0.65rem] uppercase tracking-widest font-bold">
          <span class="text-gray-400">GPU</span>
          <span class="text-gray-300">{{ gpuUsage }}%</span>
        </div>
        <div class="h-1 bg-gray-800 rounded-full overflow-hidden">
          <div class="h-full bg-purple-500 transition-all duration-300 ease-out" [style.width.%]="gpuUsage"></div>
        </div>
      </div>

    </div>
  </div>
</div>
