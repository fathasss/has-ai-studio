services:
  has-ai-ollama:
    image: ollama/ollama:latest
    container_name: has-ai-ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_GPU=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - has_ai_net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      retries: 5

  has-ai-orchestrator:
    build:
      context: .
      dockerfile: ./docker/orchestrator.Dockerfile
    container_name: has-ai-orchestrator
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=http://has-ai-ollama:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:latest}
      - TEAMLEAD_MODEL=${TEAMLEAD_MODEL:-llama3.1:latest}
      - LLM_TIMEOUT_SEC=${LLM_TIMEOUT_SEC:-600}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-8192}
      - AGENT_ROLE=master
    volumes:
      - ./core:/app/core
      - ./apps:/app/apps
      - ./prompts:/app/prompts
      - ./workspace:/app/workspace
      - orchestrator_data:/app/data
    depends_on:
      has-ai-ollama:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - has_ai_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  has-ai-web-cli:
    build:
      context: .
      dockerfile: ./docker/client.Dockerfile
    container_name: has-ai-web-cli
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      has-ai-orchestrator:
        condition: service_healthy
    networks:
      - has_ai_net

  has-ai-agent-worker:
    build:
      context: .
      dockerfile: ./docker/agent-worker.Dockerfile
    container_name: has-ai-agent-worker
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://has-ai-ollama:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:latest}
      - TEAMLEAD_MODEL=${TEAMLEAD_MODEL:-llama3.1:latest}
      - LLM_TIMEOUT_SEC=${LLM_TIMEOUT_SEC:-600}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-8192}
      - ORCHESTRATOR_URL=http://has-ai-orchestrator:8000
      - AGENT_ROLE=worker
    volumes:
      - ./core:/app/core
      - ./apps:/app/apps
      - ./prompts:/app/prompts
      - ./workspace:/app/workspace
      - orchestrator_data:/app/data
      - has_ai_sdks:/opt/sdks
    depends_on:
      has-ai-orchestrator:
        condition: service_healthy
    networks:
      - has_ai_net
    deploy:
      replicas: 1

volumes:
  ollama_data:
  orchestrator_data:
  has_ai_sdks:

networks:
  has_ai_net:
    driver: bridge
