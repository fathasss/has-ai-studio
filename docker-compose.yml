version: "3.9"

services:
  has-ai-ollama:
    image: ollama/ollama:latest
    container_name: has-ai-ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_GPU=1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - has_ai_net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      retries: 5

  has-ai-orchestrator:
    build:
      context: .
      dockerfile: ./docker/orchestrator.Dockerfile
    container_name: has-ai-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=http://has-ai-ollama:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:latest}
      - TEAMLEAD_MODEL=${TEAMLEAD_MODEL:-llama3.1:latest}
      - LLM_TIMEOUT_SEC=${LLM_TIMEOUT_SEC:-600}
      - AGENT_ROLE=master
    volumes:
      - ./core:/app/core
      - ./apps:/app/apps
      - ./prompts:/app/prompts
      - orchestrator_data:/app/data
    depends_on:
      has-ai-ollama:
        condition: service_healthy
    networks:
      - has_ai_net

  has-ai-web-cli:
    build:
      context: .
      dockerfile: ./docker/web-cli.Dockerfile
    container_name: has-ai-web-cli
    ports:
      - "4000:80"
    volumes:
      - ./web-cli:/usr/share/nginx/html
    depends_on:
      - has-ai-orchestrator
    networks:
      - has_ai_net

  has-ai-agent-worker:
    build:
      context: .
      dockerfile: ./docker/agent-worker.Dockerfile
    container_name: has-ai-agent-worker
    environment:
      - OLLAMA_URL=http://has-ai-ollama:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:latest}
      - ORCHESTRATOR_URL=http://has-ai-orchestrator:8000
      - AGENT_ROLE=worker
    volumes:
      - ./apps:/app/apps
      - ./prompts:/app/prompts
    depends_on:
      - has-ai-orchestrator
    networks:
      - has_ai_net
    deploy:
      replicas: 1

volumes:
  ollama_data:
  orchestrator_data:


networks:
  has_ai_net:
    driver: bridge
