version: "3.9"

services:
  orchestrator:
    build: ./orchestrator
    container_name: orchestrator
    ports:
      - "8000:8000"
    volumes:
      - orchestrator_data:/app/data
      - ./workspace:/app/workspace
    depends_on:
      - frontend_agent
      - backend_agent
      - designer_agent
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
    networks:
      - ai_team_net

  frontend_agent:
    build: ./agent
    container_name: frontend_agent
    environment:
      - AGENT_ROLE=frontend_dev
      - OLLAMA_URL=http://ollama:11434
      - AGENT_MODEL=llama3:latest
    depends_on:
      - ollama
    ports:
      - "5001:5000"
    volumes:
      - ./workspace:/app/workspace
    networks:
      - ai_team_net

  backend_agent:
    build: ./agent
    container_name: backend_agent
    environment:
      - AGENT_ROLE=backend_dev
      - OLLAMA_URL=http://ollama:11434
      - AGENT_MODEL=llama3:latest
    depends_on:
      - ollama
    ports:
      - "5002:5000"
    volumes:
      - ./workspace:/app/workspace
    networks:
      - ai_team_net

  designer_agent:
    build: ./agent
    container_name: designer_agent
    environment:
      - AGENT_ROLE=designer
      - OLLAMA_URL=http://ollama:11434
      - AGENT_MODEL=llama3:latest
    depends_on:
      - ollama
    ports:
      - "5003:5000"
    volumes:
      - ./workspace:/app/workspace
    networks:
      - ai_team_net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_GPU=1
    ports:
      - "36621:36621"
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - ai_team_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      retries: 10
      timeout: 5s
      start_period: 30s


  web:
    build: ./web
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./workspace:/app/workspace
    networks:
      - ai_team_net

volumes:
  ollama:
  orchestrator_data:

networks:
  ai_team_net:
    driver: bridge
