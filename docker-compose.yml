version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_GPU=1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_factory_net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      retries: 5

  api-orchestrator:
    build:
      context: .
      dockerfile: ./docker/orchestrator.Dockerfile
    container_name: api-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:latest}
      - TEAMLEAD_MODEL=${TEAMLEAD_MODEL:-llama3.1:latest}
      - LLM_TIMEOUT_SEC=${LLM_TIMEOUT_SEC:-600}
      - AGENT_ROLE=master
    volumes:
      - ./core:/app/core
      - ./apps:/app/apps
      - orchestrator_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai_factory_net

  web-cli:
    build:
      context: .
      dockerfile: ./docker/web-cli.Dockerfile
    container_name: web-cli
    ports:
      - "4000:80"
    volumes:
      - ./web-cli:/usr/share/nginx/html
    depends_on:
      - api-orchestrator
    networks:
      - ai_factory_net

  agent-worker:
    build:
      context: .
      dockerfile: ./docker/agent-worker.Dockerfile
    environment:
      - OLLAMA_URL=http://ollama:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:latest}
      - ORCHESTRATOR_URL=http://api-orchestrator:8000
      - AGENT_ROLE=worker
    volumes:
      - ./apps:/app/apps
    depends_on:
      - api-orchestrator
    networks:
      - ai_factory_net
    deploy:
      replicas: 1 # Can be scaled up with: docker-compose up --scale agent-worker=3

volumes:
  ollama_data:
  orchestrator_data:


networks:
  ai_factory_net:
    driver: bridge
